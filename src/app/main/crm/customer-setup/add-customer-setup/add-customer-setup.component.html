<div class="add-customer-setup-wrap">
	<div class="viewdata-title">
		<div class="right-top-btns">
			<a ng-click="vm.isEditorVisible = false" class="btn btn-link pull-right"
				[routerLink]="['/main/crm/customersetup']">
				<!-- <i class="fa fa-remove fa-2w mr-1"></i> -->
				<img src="assets/images/icon-close-dark.svg" height="13" width="13" alt="" style="margin-right: 8px">
				<span>Close</span>
			</a>
		</div>
		<h2>
			<!-- <i class="fa fa-pencil"></i> -->
			<img src="assets/images/icon-edit-dark.svg" height="25" width="25" alt="" style="margin-right: 8px"> Manage
			<span ng-show="vm.isClient" aria-hidden="false">Client</span>
			<!-- <span ng-show="vm.isVendor" aria-hidden="true" class="ng-hide">Vendor</span> -->
		</h2>
	</div>
	<div class="contentBox">
		<div class="card">
			<div class="row viewdata-wrapper">
				<div class="col-md-1 tier-menu">
					<ol class="nav">
						<li [ngClass]="config.stepOne ? 'active' : ''" id="stepOne" class="customanimate order-animate1">
							<a>
								<span>Basic profile</span>
							</a>
						</li>
						<li [ngClass]="config.stepTwo ? 'active' : ''" id="stepTwo" class="customanimate order-animate2">
							<a>
								<span>Notes</span>
							</a>
						</li>
						<li [ngClass]="config.stepThree ? 'active' : ''" id="stepThree" class="customanimate order-animate3">
							<a>
								<span>Payment terms</span>
							</a>
						</li>
						<!-- <li [ngClass]="blinktitle3 == 'basicprofile'?'active':''"><a><span>Bank information</span></a></li> -->
						<li [ngClass]="config.stepFour ? 'active' : ''" id="stepFour" class="customanimate order-animate4">
							<a>
								<span>Sales information</span>
							</a>
						</li>
						<!-- <li class=""><a><span>Sales information</span></a></li> -->
					</ol>
				</div>
				<div class="col-sm-10 tier-content comman-form customanimate order-animate2">
					<form>
						<div *ngIf="config.stepOne" class="infoBox">
							<h3 class="customanimate order-animate1">Basic profile</h3>
							<div class="row">
								<div class="col-md-8 mb-20">
									<mat-form-field class="example-full-width customanimate order-animate2">
										<input matInput placeholder="Client" name="title" [(ngModel)]="user.title"
											required>
									</mat-form-field>
								</div>
								<div class="col-md-4 mb-20">
									<mat-form-field class="example-full-width customanimate order-animate3">
										<input matInput placeholder="Contact Person" name="contactperson"
											[(ngModel)]="user.contactPerson">
									</mat-form-field>
								</div>
							</div>
							<div class="row">
								<div class="col-md-3 mb-20">
									<mat-form-field class="example-full-width customanimate order-animate4">
										<input matInput placeholder="Address line 1" name="addressline1"
											[(ngModel)]="user.address1">
									</mat-form-field>
								</div>
								<div class="col-md-3 mb-20">
									<mat-form-field class="example-full-width customanimate order-animate5">
										<input matInput placeholder="Address line 2" name="addressline2"
											[(ngModel)]="user.address2">
									</mat-form-field>

								</div>
								<div class="col-md-3 mb-20">
									<mat-form-field class="example-full-width customanimate order-animate6">
										<input matInput placeholder="city" name="city" [(ngModel)]="user.city">
									</mat-form-field>

								</div>
								<div class="col-md-3 mb-20">
									<mat-form-field class="example-full-width customanimate order-animate7">
										<input matInput placeholder="state" name="state" [(ngModel)]="user.state">
									</mat-form-field>

								</div>
							</div>
							<div class="row">
								<div class="col-md-3 mb-20">
									<ng-select class="customanimate order-animate8" [clearable]="false" [(ngModel)]="user.country" placeholder="Client"
										id="supplierName" [items]="countryrecords" bindLabel="title" name="country"
										(change)="recordSelected($event)">
									</ng-select>
								</div>
								<div class="col-md-3 mb-20">
									<mat-form-field class="example-full-width customanimate order-animate9">
										<input matInput placeholder="Zipcode" name="zipcode" [(ngModel)]="user.zip">
									</mat-form-field>

								</div>
								<div class="col-md-3 mb-20">
									<mat-form-field class="example-full-width customanimate order-animate10">
										<input matInput placeholder="Email" name="email" [(ngModel)]="user.email">
									</mat-form-field>

								</div>
								<div class="col-md-3 mb-20">
									<mat-form-field class="example-full-width customanimate order-animate12">
										<input matInput placeholder="Website" name="website" [(ngModel)]="user.website">
									</mat-form-field>
								</div>
							</div>
						</div>
						<div *ngIf="config.stepTwo" class="infoBox">
							<h3 class="customanimate order-animate1">Notes</h3>
							<div class="row">
								<div class="col-md-6 mb-20">
									<mat-form-field class="example-full-width customanimate order-animate2">
										<input matInput placeholder="Internal Notes" name="internalnotes"
											[(ngModel)]="user.internalNotes">
									</mat-form-field>
								</div>
								<div class="col-md-6 mb-20">
									<mat-form-field class="example-full-width customanimate order-animate3">
										<input matInput placeholder="External Notes" name="externalnotes"
											[(ngModel)]="user.externalNotes">
									</mat-form-field>

								</div>
							</div>
						</div>
						<div *ngIf="config.stepThree" class="infoBox">
							<h3 class="customanimate order-animate1">Payment terms</h3>
							<div class="row">
								<div class="col-md-4 mb-20">
									<mat-form-field class="example-full-width customanimate order-animate2">
										<input matInput placeholder="Payment Terms Duration (In Days)"
											(keydown)="AllowNumbers($event)" name="paymentTermDuration"
											[(ngModel)]="user.paymentTermDuration">
									</mat-form-field>
								</div>

							</div>
						</div>
						<div *ngIf="config.stepFour" class="infoBox">
							<h3 class="customanimate order-animate1">Sales information</h3>
							<div class="form-wrapper">
								<div class="row">
									<div class="col-md-4">
										<div class="form-group mb-20 customanimate order-animate2">
											<ng-select [clearable]="false" [(ngModel)]="user.salesRepresentative"
												placeholder="Sales Representative" [items]="salesrecords"
												bindLabel="title" name="salesRepresentative" id="RepresentativeName"
												(change)="recordSelected($event)">
											</ng-select>
										</div>
									</div>
								</div>
								<div>
									<div class="row">
										<div class="col-md-4">
											<div class="form-group mb-20 customanimate order-animate3">
												<ng-select [clearable]="false" [(ngModel)]="user.area"
													placeholder="Search Area" [items]="searcharea" bindLabel="title"
													name="area" id="areaName" (change)="recordSelected($event)">
												</ng-select>
											</div>
										</div>
										<div class="col-md-4">
											<div class="form-group mb-20 customanimate order-animate4">
												<ng-select [clearable]="false" [(ngModel)]="user.branch"
													placeholder="Region" [items]="regionrecords" bindLabel="title"
													name="region" id="regionName" (change)="recordSelected($event)">

												</ng-select>
											</div>
										</div>
										<div class="col-md-4">
											<div class="form-group mb-20 customanimate order-animate5">
												<ng-select [clearable]="false" [(ngModel)]="user.establishmentType"
													placeholder="Establishment Type" 
													bindLabel="title" name="establishmentType" id="typeName"
													(change)="recordSelected($event)">
												</ng-select>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
	<div class="button-container float-right">
		<button *ngIf="isNew" [disabled]="!user.title" class="btn btn-defult bg-none" (click)="createCustomer(user)">
			<i class="fa fa-floppy-o mr-1"></i>Save changes </button>
		<button *ngIf="!isNew" class="btn btn-defult bg-none" (click)="updateCustomer(user)">
			<i class="fa fa-floppy-o mr-1"></i>Save changes</button>
	</div>

</div>
