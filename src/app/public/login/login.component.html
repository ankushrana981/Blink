<div class="center">
  <circle-progress [percent]="100"
  [radius]="75"
  [space]="-2" 
  [outerStrokeWidth]="2"
  [outerStrokeColor]="'#37c3e1'"
  [innerStrokeColor]="'#e7e8ea'"
  [innerStrokeWidth]="2"
  [startFromZero]="false"
  [imageSrc]="'assets/images/logo-blink.svg'"
  [showSubtitle]="false"
  [animation]="true"
  [animationDuration]="2700"
  [showBackground]="false"
  [showInnerStroke]="false"
  [imageHeight]="100"
  [imageWidth]="100"
  [showImage]="true"
  [renderOnClick]="false">
  </circle-progress>
</div>
<div class="authentic-page wow zoomIn" data-wow-delay="2200ms">
  <div class="authentic-wrapper">
    <div class="row">
      <div class="col-md-6 p-0 login-logo">
        <img src="assets/images/logo-blinkred.svg" alt="blink" />
      </div>
      <div class="col-md-6 p-0">
        <div class="login-container">
          <div class="login-section">
            <h3>LOGIN</h3>
            <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

              <mat-form-field class="example-full-width">
                <mat-label>Email</mat-label>
                <input
                  matInput
                  type="email"
                  formControlName="email"
                  autocomplete="on"
                />
                 <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                  Please enter a valid email.
                </mat-error> 
              </mat-form-field>
            
              <mat-form-field class="example-full-width mt-2">
                <mat-label>Password</mat-label>
                <input
                  matInput
                  type="password"
                  formControlName="password"
                  autocomplete="on"
                />
              <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                  Password is required.
                </mat-error> 
              </mat-form-field>
            
              <div class="text-end mt-3">
                <a>Forget Password?</a>
              </div>
              <button class="btn btn-group-justified" type="submit">
                Login
              </button>
              <p class="signup-link">Don't have an account? <a>Sign up</a></p>
            </form>
            
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
